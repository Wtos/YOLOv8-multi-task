name: yolom
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.7.16
  - pytorch=1.13.1
  - torchvision=0.14.1
  - cudatoolkit=11.7  # Remove this line if using CPU only
  - pip
  - pip:
    - matplotlib>=3.2.2
    - opencv-python>=4.6.0
    - Pillow>=7.1.2
    - PyYAML>=5.3.1
    - requests>=2.23.0
    - scipy>=1.4.1
    - tqdm>=4.64.0
    - pandas>=1.1.4
    - seaborn>=0.11.0
    - psutil
    - sentry_sdk
